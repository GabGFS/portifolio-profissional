  <base href="$FLUTTER_BASE_HREF">

  <title>Gabrielle Soratto — Software Developer · Mobile & Backend</title>
  <meta name="description" content="Portfolio de Gabrielle Soratto — Desenvolvedora de Software focada em Mobile (Flutter) e Backend (Kotlin/Spring, Node, .NET). Clean Architecture, SOLID e POO.">

  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #16181D; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1000px 560px at 50% 0%, #1B2030 0%, #16181D 62%);
      transition: opacity .5s ease; z-index: 9999;
    }
    #loading .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12); border-top-color: #82BC4F;
      animation: rot .8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
