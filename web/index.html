<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <base href="$FLUTTER_BASE_HREF">

  <!-- SEO -->
  <title>Gabrielle Soratto — Software Developer · Mobile & Backend</title>
  <meta name="description" content="Portfolio de Gabrielle Soratto — Desenvolvedora de Software focada em Mobile (Flutter) e Backend (Kotlin/Spring, Node, .NET). Clean Architecture, SOLID e POO.">
  <meta name="author" content="Gabrielle Gobira Felsky Soratto">
  <meta name="keywords" content="Flutter, Dart, Kotlin, Spring Boot, Node.js, .NET, Clean Architecture, SOLID, Mobile Developer, Backend Developer, Gabrielle Soratto">
  <meta name="theme-color" content="#0D0D16">

  <!-- Open Graph / social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gabrielle Soratto — Software Developer · Mobile & Backend">
  <meta property="og:description" content="Do mobile ao backend, com arquitetura limpa e foco em qualidade.">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background-color: #0D0D16; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(1200px 600px at 50% -10%, #17122b 0%, #0D0D16 60%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .5s ease; z-index: 9999;
    }
    #loading .mono {
      width: 76px; height: 76px; border-radius: 22px;
      background: linear-gradient(135deg, #7C5CFF 0%, #6366F1 100%);
      display: flex; align-items: center; justify-content: center;
      color: #F5F4FC; font-weight: 700; font-size: 30px; letter-spacing: 1px;
      box-shadow: 0 12px 40px rgba(124,92,255,.35);
    }
    #loading .spin {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.14); border-top-color: #8B5CF6;
      animation: rot .8s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="mono">GS</div>
    <div class="spin"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
